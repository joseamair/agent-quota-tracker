name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-matrix:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project dependencies & dev tools
        run: uv sync --dev

      - name: Syntax check standalone script
        run: uv run python -m py_compile agents.py

      - name: Run automated test suite (pytest)
        run: uv run pytest -v

      - name: Test CLI entrypoint help
        run: uv run agents --help

      - name: Test POSIX Bash runner (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x agents.sh
          ./agents.sh --help

  powershell-lint:
    name: PowerShell Syntax Validation (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate agents.ps1 syntax
        shell: pwsh
        run: |
          $errors = @()
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("agents.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate agents_native.ps1 syntax
        shell: pwsh
        run: |
          $errors = @()
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("agents_native.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
